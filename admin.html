<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Admin Panel – Family Tree</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Lato:wght@300;400;700&display=swap" rel="stylesheet"/>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<style>
  :root {
    --cream: #faf7f2;
    --warm-white: #fff9f0;
    --brown-dark: #2c1810;
    --brown-mid: #6b3d2e;
    --brown-light: #c4956a;
    --brown-pale: #e8d5c0;
    --green-deep: #2d4a3e;
    --green-mid: #4a7c6f;
    --green-pale: #d4e6e1;
    --gold: #b8860b;
    --gold-light: #f0d080;
    --text-dark: #1a0f0a;
    --text-mid: #4a3728;
    --text-light: #8a6a55;
    --border: #d4c4b0;
    --error: #c0392b;
    --success: #27634a;
    --pending-bg: #fffbeb;
    --pending-border: #fcd34d;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Lato', sans-serif; background: var(--cream); color: var(--text-dark); min-height: 100vh; }

  /* ── Login screen ── */
  .login-screen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .login-card {
    background: white;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 48px;
    width: 100%;
    max-width: 400px;
    box-shadow: 0 8px 40px rgba(44,24,16,0.1);
  }
  .login-title {
    font-family: 'Playfair Display', serif;
    font-size: 26px;
    color: var(--brown-dark);
    margin-bottom: 6px;
  }
  .login-sub {
    font-size: 13px;
    color: var(--text-light);
    margin-bottom: 32px;
  }
  .login-field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 18px; }
  .login-field label { font-size: 12px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--text-light); }
  .login-field input {
    padding: 11px 14px;
    border: 1px solid var(--border);
    border-radius: 4px;
    font-family: 'Lato', sans-serif;
    font-size: 14px;
    color: var(--text-dark);
    outline: none;
    transition: border-color 0.2s;
    width: 100%;
  }
  .login-field input:focus { border-color: var(--brown-mid); }
  .btn-login {
    width: 100%;
    padding: 13px;
    background: var(--brown-dark);
    color: var(--gold-light);
    border: none;
    border-radius: 4px;
    font-family: 'Lato', sans-serif;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    cursor: pointer;
    margin-top: 8px;
    transition: background 0.2s;
  }
  .btn-login:hover { background: var(--brown-mid); }
  .btn-login:disabled { opacity: 0.5; cursor: not-allowed; }
  .login-error {
    margin-top: 14px;
    padding: 10px 14px;
    background: #fef2f2;
    border: 1px solid #fca5a5;
    border-radius: 4px;
    font-size: 13px;
    color: var(--error);
    display: none;
  }

  /* ── Admin layout ── */
  .admin-screen { display: none; }
  .admin-screen.visible { display: block; }

  header {
    background: var(--brown-dark);
    padding: 16px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 3px solid var(--gold);
  }
  .header-title { font-family: 'Playfair Display', serif; color: var(--gold-light); font-size: 22px; }
  .header-right { display: flex; align-items: center; gap: 16px; }
  .admin-email { font-size: 13px; color: var(--brown-pale); }
  .btn-sm {
    padding: 7px 16px;
    border-radius: 4px;
    font-family: 'Lato', sans-serif;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    cursor: pointer;
    border: none;
    text-decoration: none;
    transition: all 0.2s;
  }
  .btn-outline-gold { background: transparent; color: var(--gold-light); border: 1px solid var(--gold); }
  .btn-outline-gold:hover { background: var(--gold); color: var(--brown-dark); }
  .btn-danger { background: #fee2e2; color: var(--error); border: 1px solid #fca5a5; }
  .btn-danger:hover { background: var(--error); color: white; }

  /* ── Tabs ── */
  .tabs {
    background: white;
    border-bottom: 1px solid var(--border);
    padding: 0 32px;
    display: flex;
    gap: 0;
  }
  .tab {
    padding: 14px 20px;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    color: var(--text-light);
    cursor: pointer;
    border-bottom: 3px solid transparent;
    transition: all 0.2s;
    position: relative;
  }
  .tab.active { color: var(--brown-dark); border-bottom-color: var(--gold); }
  .tab:hover:not(.active) { color: var(--text-mid); }
  .tab-badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 18px;
    height: 18px;
    padding: 0 5px;
    background: var(--gold);
    color: var(--brown-dark);
    border-radius: 9px;
    font-size: 10px;
    font-weight: 700;
    margin-left: 6px;
  }

  /* ── Main content ── */
  .main { padding: 28px 32px; }

  /* ── Cards ── */
  .cards-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 18px;
  }

  .member-card {
    background: white;
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    transition: box-shadow 0.2s;
  }
  .member-card:hover { box-shadow: 0 4px 20px rgba(44,24,16,0.08); }
  .member-card.pending { border-top: 3px solid var(--gold); }
  .member-card.approved { border-top: 3px solid var(--green-mid); }

  .card-header {
    padding: 16px 18px;
    display: flex;
    align-items: flex-start;
    gap: 14px;
  }
  .card-avatar {
    width: 50px;
    height: 50px;
    border-radius: 50%;
    background: var(--brown-pale);
    flex-shrink: 0;
    object-fit: cover;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    color: var(--brown-mid);
    font-family: 'Playfair Display', serif;
    font-weight: 600;
  }
  .card-avatar img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }

  .card-info { flex: 1; min-width: 0; }
  .card-name {
    font-family: 'Playfair Display', serif;
    font-size: 17px;
    color: var(--text-dark);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .card-meta { font-size: 12px; color: var(--text-light); margin-top: 3px; }

  .card-status {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 3px 10px;
    border-radius: 12px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    flex-shrink: 0;
  }
  .status-pending { background: var(--pending-bg); color: #92400e; border: 1px solid var(--pending-border); }
  .status-approved { background: var(--green-pale); color: var(--green-deep); border: 1px solid var(--green-mid); }

  .card-body { padding: 0 18px 14px; }
  .card-detail-row { font-size: 12px; color: var(--text-light); margin-bottom: 5px; }
  .card-detail-row strong { color: var(--text-mid); font-weight: 700; }

  .card-notes {
    margin-top: 10px;
    padding: 10px 12px;
    background: var(--cream);
    border-radius: 4px;
    font-size: 12px;
    color: var(--text-mid);
    line-height: 1.6;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .card-actions {
    padding: 12px 18px;
    border-top: 1px solid var(--border);
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: center;
  }

  .btn-approve {
    padding: 7px 16px;
    background: var(--green-deep);
    color: white;
    border: none;
    border-radius: 4px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    cursor: pointer;
    transition: background 0.2s;
  }
  .btn-approve:hover { background: var(--green-mid); }

  .btn-unapprove {
    padding: 7px 16px;
    background: #fffbeb;
    color: #92400e;
    border: 1px solid var(--pending-border);
    border-radius: 4px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-unapprove:hover { background: #fef3c7; }

  .btn-edit-inline {
    padding: 7px 16px;
    background: white;
    color: var(--text-mid);
    border: 1px solid var(--border);
    border-radius: 4px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
    margin-left: auto;
  }
  .btn-edit-inline:hover { background: var(--cream); }

  /* ── Edit modal ── */
  .modal-backdrop {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(44,24,16,0.5);
    z-index: 200;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .modal-backdrop.open { display: flex; }

  .modal {
    background: white;
    border-radius: 10px;
    width: 100%;
    max-width: 640px;
    max-height: 90vh;
    overflow-y: auto;
    padding: 32px;
    position: relative;
  }
  .modal-title {
    font-family: 'Playfair Display', serif;
    font-size: 22px;
    color: var(--brown-dark);
    margin-bottom: 24px;
  }
  .modal-close {
    position: absolute;
    top: 16px;
    right: 16px;
    width: 30px;
    height: 30px;
    background: var(--cream);
    border: 1px solid var(--border);
    border-radius: 50%;
    font-size: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .edit-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .edit-field { display: flex; flex-direction: column; gap: 5px; }
  .edit-field label { font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--text-light); }
  .edit-field input, .edit-field select, .edit-field textarea {
    padding: 9px 12px;
    border: 1px solid var(--border);
    border-radius: 4px;
    font-family: 'Lato', sans-serif;
    font-size: 13px;
    color: var(--text-dark);
    outline: none;
    transition: border-color 0.2s;
    width: 100%;
  }
  .edit-field input:focus, .edit-field select:focus, .edit-field textarea:focus { border-color: var(--brown-mid); }
  .edit-field textarea { min-height: 70px; resize: vertical; }
  .edit-field.span-2 { grid-column: span 2; }

  .modal-footer {
    margin-top: 24px;
    display: flex;
    gap: 10px;
    justify-content: flex-end;
  }
  .btn-save {
    padding: 10px 24px;
    background: var(--brown-dark);
    color: var(--gold-light);
    border: none;
    border-radius: 4px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.2s;
  }
  .btn-save:hover { background: var(--brown-mid); }
  .btn-cancel {
    padding: 10px 24px;
    background: white;
    color: var(--text-mid);
    border: 1px solid var(--border);
    border-radius: 4px;
    font-size: 13px;
    cursor: pointer;
  }

  /* Privacy toggle row in modal */
  .toggle-row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: var(--text-mid);
  }
  .toggle-row input[type=checkbox] { accent-color: var(--brown-mid); width: 15px; height: 15px; }

  /* ── Empty state ── */
  .empty-msg {
    text-align: center;
    padding: 60px 24px;
    color: var(--text-light);
  }
  .empty-msg .big { font-size: 40px; margin-bottom: 12px; }
  .empty-msg p { font-size: 14px; line-height: 1.6; }

  /* ── Toast ── */
  .toast {
    position: fixed;
    bottom: 24px;
    right: 24px;
    padding: 12px 20px;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 700;
    color: white;
    z-index: 999;
    transform: translateY(80px);
    opacity: 0;
    transition: all 0.3s;
    pointer-events: none;
  }
  .toast.show { transform: translateY(0); opacity: 1; }
  .toast.success { background: var(--green-deep); }
  .toast.error { background: var(--error); }

  @media (max-width: 600px) {
    header { padding: 14px 20px; }
    .main { padding: 20px; }
    .tabs { padding: 0 20px; }
    .edit-grid { grid-template-columns: 1fr; }
    .edit-field.span-2 { grid-column: span 1; }
  }
</style>
</head>
<body>

<!-- Login screen -->
<div class="login-screen" id="login-screen">
  <div class="login-card">
    <div class="login-title">Admin Panel</div>
    <div class="login-sub">Sign in to manage the family tree</div>
    <div class="login-field">
      <label>Email</label>
      <input type="email" id="login-email" placeholder="admin@example.com" onkeydown="if(event.key==='Enter') doLogin()"/>
    </div>
    <div class="login-field">
      <label>Password</label>
      <input type="password" id="login-password" placeholder="••••••••" onkeydown="if(event.key==='Enter') doLogin()"/>
    </div>
    <button class="btn-login" id="login-btn" onclick="doLogin()">Sign In</button>
    <div class="login-error" id="login-error"></div>
  </div>
</div>

<!-- Admin app -->
<div class="admin-screen" id="admin-screen">
  <header>
    <div class="header-title">Family Tree Admin</div>
    <div class="header-right">
      <span class="admin-email" id="admin-email-display"></span>
      <a href="index.html" class="btn-sm btn-outline-gold">View Tree</a>
      <button class="btn-sm btn-danger" onclick="doLogout()">Sign Out</button>
    </div>
  </header>

  <div class="tabs">
    <div class="tab active" id="tab-pending" onclick="switchTab('pending')">
      Pending <span class="tab-badge" id="pending-count">0</span>
    </div>
    <div class="tab" id="tab-approved" onclick="switchTab('approved')">
      Approved <span class="tab-badge" id="approved-count">0</span>
    </div>
  </div>

  <div class="main">
    <div class="cards-grid" id="cards-grid"></div>
    <div class="empty-msg" id="empty-msg" style="display:none">
      <div class="big">✓</div>
      <p>No pending submissions right now.</p>
    </div>
  </div>
</div>

<!-- Edit modal -->
<div class="modal-backdrop" id="modal-backdrop">
  <div class="modal">
    <button class="modal-close" onclick="closeModal()">×</button>
    <div class="modal-title">Edit Member</div>
    <input type="hidden" id="edit-id"/>
    <div class="edit-grid">
      <div class="edit-field">
        <label>Full name</label>
        <input type="text" id="edit-full_name"/>
      </div>
      <div class="edit-field">
        <label>Nickname</label>
        <input type="text" id="edit-nickname"/>
      </div>
      <div class="edit-field">
        <label>Suffix</label>
        <input type="text" id="edit-suffix"/>
      </div>
      <div class="edit-field">
        <label>Gender</label>
        <select id="edit-gender">
          <option value="">Unknown</option>
          <option value="male">Male</option>
          <option value="female">Female</option>
          <option value="other">Other</option>
        </select>
      </div>
      <div class="edit-field">
        <label>Birth date</label>
        <input type="date" id="edit-birth_date"/>
      </div>
      <div class="edit-field">
        <label>Death date</label>
        <input type="date" id="edit-death_date"/>
      </div>
      <div class="edit-field">
        <label>Birthplace</label>
        <input type="text" id="edit-birth_place"/>
      </div>
      <div class="edit-field">
        <label>Generation number</label>
        <input type="number" id="edit-generation_number" min="1"/>
      </div>
      <div class="edit-field span-2">
        <label>Photo URL</label>
        <input type="text" id="edit-photo_url"/>
      </div>
      <div class="edit-field span-2">
        <label>Bio</label>
        <textarea id="edit-bio"></textarea>
      </div>
      <div class="edit-field span-2">
        <label>Admin notes</label>
        <textarea id="edit-notes"></textarea>
      </div>

      <div class="edit-field span-2" style="gap:10px">
        <label>Privacy & visibility</label>
        <label class="toggle-row"><input type="checkbox" id="edit-is_living"/> Is living</label>
        <label class="toggle-row"><input type="checkbox" id="edit-hide_birth_date"/> Hide birth date</label>
        <label class="toggle-row"><input type="checkbox" id="edit-hide_birth_place"/> Hide birthplace</label>
        <label class="toggle-row"><input type="checkbox" id="edit-hide_bio"/> Hide bio</label>
        <label class="toggle-row"><input type="checkbox" id="edit-hide_photo"/> Hide photo</label>
        <label class="toggle-row"><input type="checkbox" id="edit-is_private"/> Hide from public tree entirely</label>
        <label class="toggle-row"><input type="checkbox" id="edit-is_unlinked"/> Mark as unlinked (unknown connections)</label>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-save" onclick="saveEdit()">Save Changes</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="config.js"></script>
<script>
const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let currentTab = 'pending';
let allMembers = [];

// ── Auth ──
async function init() {
  const { data: { session } } = await db.auth.getSession();
  if (session) showAdmin(session.user);
}

async function doLogin() {
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;
  const btn = document.getElementById('login-btn');
  const errEl = document.getElementById('login-error');
  btn.disabled = true;
  btn.textContent = 'Signing in…';
  errEl.style.display = 'none';

  const { data, error } = await db.auth.signInWithPassword({ email, password });
  if (error) {
    errEl.textContent = error.message;
    errEl.style.display = 'block';
    btn.disabled = false;
    btn.textContent = 'Sign In';
  } else {
    showAdmin(data.user);
  }
}

async function doLogout() {
  await db.auth.signOut();
  document.getElementById('admin-screen').classList.remove('visible');
  document.getElementById('login-screen').style.display = 'flex';
}

function showAdmin(user) {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('admin-screen').classList.add('visible');
  document.getElementById('admin-email-display').textContent = user.email;
  loadMembers();
}

// ── Data ──
async function loadMembers() {
  const { data, error } = await db.from('family_members').select('*').order('created_at', { ascending: false });
  if (error) { showToast('Failed to load members', 'error'); return; }
  allMembers = data || [];
  updateCounts();
  renderCards();
}

function updateCounts() {
  const pending = allMembers.filter(m => !m.approved).length;
  const approved = allMembers.filter(m => m.approved).length;
  document.getElementById('pending-count').textContent = pending;
  document.getElementById('approved-count').textContent = approved;
}

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById('tab-' + tab).classList.add('active');
  renderCards();
}

function renderCards() {
  const grid = document.getElementById('cards-grid');
  const empty = document.getElementById('empty-msg');
  const filtered = allMembers.filter(m => currentTab === 'pending' ? !m.approved : m.approved);

  if (filtered.length === 0) {
    grid.innerHTML = '';
    empty.style.display = 'block';
    empty.querySelector('p').textContent = currentTab === 'pending'
      ? 'No pending submissions right now.'
      : 'No approved members yet.';
    return;
  }
  empty.style.display = 'none';
  grid.innerHTML = '';
  filtered.forEach(m => grid.appendChild(buildCard(m)));
}

function buildCard(m) {
  const card = document.createElement('div');
  card.className = 'member-card ' + (m.approved ? 'approved' : 'pending');

  const initials = (m.full_name || '?').split(' ').map(w => w[0]).join('').slice(0,2).toUpperCase();
  const photoHTML = (m.photo_url && !m.hide_photo)
    ? `<div class="card-avatar"><img src="${m.photo_url}" alt="" onerror="this.parentElement.textContent='${initials}'"/></div>`
    : `<div class="card-avatar">${initials}</div>`;

  const statusClass = m.approved ? 'status-approved' : 'status-pending';
  const statusText = m.approved ? 'Approved' : 'Pending';

  const metaParts = [];
  if (!m.hide_birth_date && m.birth_date) metaParts.push(m.birth_date);
  if (!m.hide_birth_place && m.birth_place) metaParts.push(m.birth_place);

  const rows = [
    m.submitted_by ? ['Submitted by', m.submitted_by] : null,
    m.gender ? ['Gender', capitalize(m.gender)] : null,
    m.is_private ? ['Visibility', 'Hidden from public'] : null,
    m.is_unlinked ? ['Connections', 'Unlinked'] : null,
  ].filter(Boolean);

  card.innerHTML = `
    <div class="card-header">
      ${photoHTML}
      <div class="card-info">
        <div class="card-name">${m.full_name}${m.suffix ? ' ' + m.suffix : ''}</div>
        <div class="card-meta">${metaParts.join(' · ') || 'No date/location'}</div>
      </div>
      <div class="card-status ${statusClass}">${statusText}</div>
    </div>
    <div class="card-body">
      ${rows.map(([l,v]) => `<div class="card-detail-row"><strong>${l}:</strong> ${v}</div>`).join('')}
      ${m.notes ? `<div class="card-notes">${escHtml(m.notes)}</div>` : ''}
    </div>
    <div class="card-actions">
      ${!m.approved
        ? `<button class="btn-approve" onclick="approve('${m.id}')">Approve</button>`
        : `<button class="btn-unapprove" onclick="unapprove('${m.id}')">Un-approve</button>`
      }
      <button class="btn-sm btn-danger" onclick="deleteMember('${m.id}')">Delete</button>
      <button class="btn-edit-inline" onclick="openEdit('${m.id}')">Edit</button>
    </div>
  `;
  return card;
}

async function approve(id) {
  const { error } = await db.from('family_members').update({ approved: true }).eq('id', id);
  if (error) { showToast('Error approving', 'error'); return; }
  const m = allMembers.find(x => x.id === id);
  if (m) m.approved = true;
  updateCounts(); renderCards();
  showToast('Member approved and now visible on tree', 'success');
}

async function unapprove(id) {
  const { error } = await db.from('family_members').update({ approved: false }).eq('id', id);
  if (error) { showToast('Error', 'error'); return; }
  const m = allMembers.find(x => x.id === id);
  if (m) m.approved = false;
  updateCounts(); renderCards();
  showToast('Member moved back to pending', 'success');
}

async function deleteMember(id) {
  if (!confirm('Are you sure you want to permanently delete this member? This cannot be undone.')) return;
  const { error } = await db.from('family_members').delete().eq('id', id);
  if (error) { showToast('Error deleting', 'error'); return; }
  allMembers = allMembers.filter(x => x.id !== id);
  updateCounts(); renderCards();
  showToast('Member deleted', 'success');
}

// ── Edit modal ──
function openEdit(id) {
  const m = allMembers.find(x => x.id === id);
  if (!m) return;
  document.getElementById('edit-id').value = m.id;
  const fields = ['full_name','nickname','suffix','gender','birth_date','death_date','birth_place','generation_number','photo_url','bio','notes'];
  fields.forEach(f => {
    const el = document.getElementById('edit-' + f);
    if (el) el.value = m[f] || '';
  });
  const checks = ['is_living','hide_birth_date','hide_birth_place','hide_bio','hide_photo','is_private','is_unlinked'];
  checks.forEach(f => {
    const el = document.getElementById('edit-' + f);
    if (el) el.checked = !!m[f];
  });
  document.getElementById('modal-backdrop').classList.add('open');
}

async function saveEdit() {
  const id = document.getElementById('edit-id').value;
  const fields = ['full_name','nickname','suffix','gender','birth_date','death_date','birth_place','generation_number','photo_url','bio','notes'];
  const checks = ['is_living','hide_birth_date','hide_birth_place','hide_bio','hide_photo','is_private','is_unlinked'];

  const updates = { updated_at: new Date().toISOString() };
  fields.forEach(f => {
    const val = document.getElementById('edit-' + f)?.value;
    updates[f] = val === '' ? null : val;
  });
  checks.forEach(f => {
    updates[f] = document.getElementById('edit-' + f)?.checked || false;
  });

  const { error } = await db.from('family_members').update(updates).eq('id', id);
  if (error) { showToast('Error saving', 'error'); return; }
  const idx = allMembers.findIndex(x => x.id === id);
  if (idx > -1) allMembers[idx] = { ...allMembers[idx], ...updates };
  closeModal(); renderCards();
  showToast('Changes saved', 'success');
}

function closeModal() {
  document.getElementById('modal-backdrop').classList.remove('open');
}

// ── Utils ──
function capitalize(s) { return s ? s[0].toUpperCase() + s.slice(1) : ''; }

function escHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function showToast(msg, type = 'success') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast ' + type;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

init();
</script>
