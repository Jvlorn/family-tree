<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Admin – Family Tree</title>
<link rel="stylesheet" href="shared.css"/>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="shared.js"></script>
<style>
  body { overflow-y:auto; }

  /* Login */
  .login-screen { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
  .login-card { background:white; border:1px solid var(--border); border-radius:10px; padding:42px; width:100%; max-width:390px; box-shadow:var(--shadow); }
  .login-title { font-family:'Playfair Display',serif; font-size:24px; color:var(--brown-dark); margin-bottom:4px; }
  .login-sub { font-size:13px; color:var(--text-light); margin-bottom:26px; }
  .login-error { margin-top:11px; padding:9px 13px; background:#fef2f2; border:1px solid #fca5a5; border-radius:4px; font-size:13px; color:var(--error); display:none; }

  /* Admin layout */
  .admin-wrap { display:none; flex-direction:column; min-height:100vh; }
  .admin-wrap.visible { display:flex; }
  .admin-header { background:var(--brown-dark); padding:13px 30px; display:flex; align-items:center; justify-content:space-between; border-bottom:3px solid var(--gold); flex-shrink:0; }
  .admin-title { font-family:'Playfair Display',serif; color:var(--gold-light); font-size:19px; }
  .admin-header-right { display:flex; align-items:center; gap:10px; }
  .admin-email-lbl { font-size:12px; color:var(--brown-pale); }

  /* Tabs */
  .tabs { background:white; border-bottom:1px solid var(--border); padding:0 30px; display:flex; overflow-x:auto; flex-shrink:0; }
  .tab { padding:12px 16px; font-size:11px; font-weight:700; letter-spacing:.5px; text-transform:uppercase; color:var(--text-light); cursor:pointer; border-bottom:3px solid transparent; transition:all .2s; white-space:nowrap; }
  .tab.active { color:var(--brown-dark); border-bottom-color:var(--gold); }
  .tab-badge { display:inline-flex; align-items:center; justify-content:center; min-width:17px; height:17px; padding:0 4px; background:var(--gold); color:var(--brown-dark); border-radius:9px; font-size:9px; font-weight:700; margin-left:5px; }

  /* Main */
  .main { padding:22px 30px; flex:1; }
  .main-toolbar { display:flex; justify-content:flex-end; margin-bottom:14px; }

  /* Cards */
  .cards-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:14px; }
  .member-card { background:white; border:1px solid var(--border); border-radius:8px; overflow:hidden; transition:box-shadow .2s; }
  .member-card:hover { box-shadow:var(--shadow); }
  .member-card.pending { border-top:3px solid var(--gold); }
  .member-card.approved { border-top:3px solid var(--green-mid); }
  .member-card.req-card { border-top:3px solid #93c5fd; }
  .member-card.report-card { border-top:3px solid #d8b4fe; }
  .member-card.banned-card { border-top:3px solid var(--error); }

  .card-header { padding:13px 15px; display:flex; align-items:flex-start; gap:11px; }
  .card-av { width:42px; height:42px; border-radius:50%; background:var(--brown-pale); flex-shrink:0; display:flex; align-items:center; justify-content:center; font-family:'Playfair Display',serif; font-size:14px; color:var(--brown-mid); overflow:hidden; }
  .card-av img { width:100%; height:100%; border-radius:50%; object-fit:cover; }
  .card-info { flex:1; min-width:0; }
  .card-name { font-family:'Playfair Display',serif; font-size:15px; color:var(--text-dark); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .card-sub { font-size:11px; color:var(--text-light); margin-top:2px; }
  .card-body { padding:0 15px 11px; }
  .card-detail { font-size:12px; color:var(--text-light); margin-bottom:4px; }
  .card-detail strong { color:var(--text-mid); }
  .card-notes { margin-top:7px; padding:8px 10px; background:var(--cream); border-radius:4px; font-size:12px; color:var(--text-mid); line-height:1.6; white-space:pre-wrap; word-break:break-word; max-height:90px; overflow-y:auto; }
  .card-actions { padding:10px 15px; border-top:1px solid var(--border); display:flex; gap:6px; flex-wrap:wrap; align-items:center; }

  /* Member modal */
  .modal { max-width:660px; }
  .privacy-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:8px; }

  /* Empty */
  .empty-msg { text-align:center; padding:60px 24px; color:var(--text-light); }
  .empty-msg .big { font-size:40px; margin-bottom:10px; }
  .empty-msg p { font-size:14px; line-height:1.6; }

  @media (max-width:600px) {
    .admin-header, .main { padding-left:16px; padding-right:16px; }
    .tabs { padding:0 12px; }
  }
</style>
</head>
<body>

<div class="login-screen" id="login-screen">
  <div class="login-card">
    <div class="login-title">Admin Panel</div>
    <div class="login-sub">Family Tree Management</div>
    <div class="field" style="margin-bottom:14px;">
      <label>Email</label>
      <input type="email" id="login-email" placeholder="admin@example.com" onkeydown="if(event.key==='Enter')doLogin()"/>
    </div>
    <div class="field" style="margin-bottom:18px;">
      <label>Password</label>
      <input type="password" id="login-pw" placeholder="••••••••" onkeydown="if(event.key==='Enter')doLogin()"/>
    </div>
    <button class="btn btn-dark" style="width:100%;padding:12px;font-size:13px;" id="login-btn" onclick="doLogin()">Sign In</button>
    <div class="login-error" id="login-error"></div>
  </div>
</div>

<div class="admin-wrap" id="admin-wrap">
  <div class="admin-header">
    <div class="admin-title">Family Tree Admin</div>
    <div class="admin-header-right">
      <span class="admin-email-lbl" id="admin-email-lbl"></span>
      <a href="index.html" class="btn btn-outline" style="font-size:11px;padding:6px 13px;">View Tree</a>
      <button class="btn btn-danger" style="font-size:11px;padding:6px 13px;" onclick="doLogout()">Sign Out</button>
    </div>
  </div>

  <div class="tabs">
    <div class="tab active" id="tab-pending" onclick="switchTab('pending')">Pending <span class="tab-badge" id="cnt-pending">0</span></div>
    <div class="tab" id="tab-approved" onclick="switchTab('approved')">Approved <span class="tab-badge" id="cnt-approved">0</span></div>
    <div class="tab" id="tab-requests" onclick="switchTab('requests')">Requests <span class="tab-badge" id="cnt-requests">0</span></div>
    <div class="tab" id="tab-reports" onclick="switchTab('reports')">Reports <span class="tab-badge" id="cnt-reports">0</span></div>
    <div class="tab" id="tab-banned" onclick="switchTab('banned')">Banned <span class="tab-badge" id="cnt-banned">0</span></div>
  </div>

  <div class="main">
    <div class="main-toolbar">
      <button class="btn btn-gold" onclick="openAddModal()">+ Add Member Directly</button>
    </div>
    <div class="cards-grid" id="cards-grid"></div>
    <div class="empty-msg" id="empty-msg" style="display:none">
      <div class="big">✓</div>
      <p id="empty-text">Nothing here.</p>
    </div>
  </div>
</div>

<!-- Member add/edit modal -->
<div class="modal-backdrop" id="member-modal">
  <div class="modal">
    <button class="modal-close" onclick="closeMemberModal()">×</button>
    <div class="modal-title" id="member-modal-title">Add Member</div>
    <input type="hidden" id="edit-id"/>
    <div class="form-grid">
      <div class="field"><label>Full name <span class="req">*</span></label><input type="text" id="ef-full_name"/></div>
      <div class="field"><label>Nickname</label><input type="text" id="ef-nickname"/></div>
      <div class="field"><label>Suffix</label><input type="text" id="ef-suffix"/></div>
      <div class="field"><label>Gender</label>
        <select id="ef-gender"><option value="">Unknown</option><option value="male">Male</option><option value="female">Female</option><option value="other">Other</option></select>
      </div>
      <div class="field"><label>Birth date</label><input type="date" id="ef-birth_date"/></div>
      <div class="field"><label>Death date</label><input type="date" id="ef-death_date"/></div>
      <div class="field"><label>Birthplace</label><input type="text" id="ef-birth_place"/></div>
      <div class="field"><label>Generation #</label><input type="number" id="ef-generation_number" min="1"/></div>
      <div class="field span-2"><label>Photo URL</label><input type="text" id="ef-photo_url"/></div>
      <div class="field"><label>Contact email</label><input type="text" id="ef-contact_email"/></div>
      <div class="field"><label>Facebook URL</label><input type="text" id="ef-facebook_url"/></div>
      <div class="field span-2"><label>Bio</label><textarea id="ef-bio"></textarea></div>
      <div class="field span-2"><label>Admin notes</label><textarea id="ef-notes"></textarea></div>
    </div>

    <div style="margin-top:18px;">
      <div class="section-title" style="margin-bottom:10px;">Link Family Connections</div>
      <p style="font-size:12px;color:var(--text-light);margin-bottom:12px;line-height:1.5;">Connections are saved immediately and approved automatically.</p>
      <div id="admin-conn-list"></div>
      <button type="button" class="add-conn-btn" onclick="addAdminConn()">+ Add connection</button>
    </div>

    <div style="margin-top:18px;">
      <div class="section-title" style="margin-bottom:10px;">Privacy & Visibility</div>
      <div class="privacy-grid">
        <label class="check-row"><input type="checkbox" id="ef-is_living" checked/> Is living</label>
        <label class="check-row"><input type="checkbox" id="ef-approved"/> Approved (visible)</label>
        <label class="check-row"><input type="checkbox" id="ef-hide_birth_date"/> Hide birth date</label>
        <label class="check-row"><input type="checkbox" id="ef-hide_birth_place"/> Hide birthplace</label>
        <label class="check-row"><input type="checkbox" id="ef-hide_bio"/> Hide bio</label>
        <label class="check-row"><input type="checkbox" id="ef-hide_photo"/> Hide photo</label>
        <label class="check-row"><input type="checkbox" id="ef-is_private"/> Hide entirely</label>
        <label class="check-row"><input type="checkbox" id="ef-is_unlinked"/> Mark as unlinked</label>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeMemberModal()">Cancel</button>
      <button class="btn btn-dark" onclick="saveMember()">Save Member</button>
    </div>
  </div>
</div>

<!-- Request review modal -->
<div class="modal-backdrop" id="req-modal">
  <div class="modal">
    <button class="modal-close" onclick="closeReqModal()">×</button>
    <div class="modal-title" id="req-modal-title">Review Request</div>
    <div id="req-modal-body"></div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeReqModal()">Close</button>
      <button class="btn btn-danger" id="req-reject-btn">Reject</button>
      <button class="btn btn-success" id="req-approve-btn">Approve</button>
    </div>
  </div>
</div>

<!-- Ban modal -->
<div class="modal-backdrop" id="ban-modal">
  <div class="modal">
    <button class="modal-close" onclick="document.getElementById('ban-modal').classList.remove('open')">×</button>
    <div class="modal-title">Ban User</div>
    <p style="font-size:13px;color:var(--text-light);margin-bottom:18px;" id="ban-modal-sub"></p>
    <div class="field">
      <label>Reason for ban <span class="req">*</span></label>
      <textarea id="ban-reason" placeholder="e.g. Submitted false information, harassment…"></textarea>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="document.getElementById('ban-modal').classList.remove('open')">Cancel</button>
      <button class="btn btn-danger" onclick="confirmBan()">Confirm Ban</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
let currentTab = 'pending';
let allMembers = [], allRequests = [], allReports = [], allBanned = [];
let pendingBanData = null;
// Store picker instances by conn row id
const adminPickerMap = {};
let adminConnSeq = 0;

// ── Auth ──
async function doLogin() {
  const email = document.getElementById('login-email').value.trim();
  const pw = document.getElementById('login-pw').value;
  const btn = document.getElementById('login-btn');
  const errEl = document.getElementById('login-error');
  btn.disabled=true; btn.textContent='Signing in…'; errEl.style.display='none';
  const { data, error } = await db.auth.signInWithPassword({ email, password: pw });
  if (error) { errEl.textContent=error.message; errEl.style.display='block'; btn.disabled=false; btn.textContent='Sign In'; }
  else showAdmin(data.user);
}

async function doLogout() {
  await db.auth.signOut();
  document.getElementById('admin-wrap').classList.remove('visible');
  document.getElementById('login-screen').style.display='flex';
}

function showAdmin(user) {
  document.getElementById('login-screen').style.display='none';
  document.getElementById('admin-wrap').classList.add('visible');
  document.getElementById('admin-email-lbl').textContent = user.email;
  loadAll();
}

// ── Data ──
async function loadAll() {
  const [mRes, rqRes, rpRes, bnRes] = await Promise.all([
    db.from('family_members').select('*').order('created_at',{ascending:false}),
    db.from('member_requests').select('*').order('created_at',{ascending:false}),
    db.from('reports').select('*').order('created_at',{ascending:false}),
    db.from('banned_users').select('*').order('banned_at',{ascending:false}),
  ]);
  allMembers = mRes.data||[];
  allRequests = rqRes.data||[];
  allReports = rpRes.data||[];
  allBanned = bnRes.data||[];
  const { data: rels } = await db.from('relationships').select('*');
  window._allRelationships = rels||[];
  updateCounts(); renderCards();
}

function updateCounts() {
  document.getElementById('cnt-pending').textContent = allMembers.filter(m=>!m.approved).length;
  document.getElementById('cnt-approved').textContent = allMembers.filter(m=>m.approved).length;
  document.getElementById('cnt-requests').textContent = allRequests.filter(r=>r.status==='pending').length;
  document.getElementById('cnt-reports').textContent = allReports.filter(r=>r.status==='pending').length;
  document.getElementById('cnt-banned').textContent = allBanned.length;
}

function switchTab(tab) {
  currentTab=tab;
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('tab-'+tab).classList.add('active');
  renderCards();
}

function renderCards() {
  const grid=document.getElementById('cards-grid');
  const empty=document.getElementById('empty-msg');
  let items=[];
  if (currentTab==='pending') items=allMembers.filter(m=>!m.approved);
  else if (currentTab==='approved') items=allMembers.filter(m=>m.approved);
  else if (currentTab==='requests') items=allRequests.filter(r=>r.status==='pending');
  else if (currentTab==='reports') items=allReports.filter(r=>r.status==='pending');
  else if (currentTab==='banned') items=allBanned;

  if (!items.length) {
    grid.innerHTML=''; empty.style.display='block';
    const msgs={pending:'No pending submissions.',approved:'No approved members.',requests:'No pending requests.',reports:'No pending reports.',banned:'No banned users.'};
    document.getElementById('empty-text').textContent=msgs[currentTab];
    return;
  }
  empty.style.display='none'; grid.innerHTML='';
  items.forEach(item=>{
    if (currentTab==='requests') grid.appendChild(buildReqCard(item));
    else if (currentTab==='reports') grid.appendChild(buildReportCard(item));
    else if (currentTab==='banned') grid.appendChild(buildBannedCard(item));
    else grid.appendChild(buildMemberCard(item));
  });
}

// ── Member card ──
function buildMemberCard(m) {
  const card=document.createElement('div');
  card.className='member-card '+(m.approved?'approved':'pending');
  const avHTML = m.photo_url&&!m.hide_photo
    ? `<div class="card-av"><img src="${escHtml(m.photo_url)}" onerror="this.parentElement.textContent='${initials(m.full_name)}'"/></div>`
    : `<div class="card-av">${initials(m.full_name)}</div>`;
  const details=[
    m.submitted_by_name?['Submitted by',m.submitted_by_name]:null,
    m.submitted_by_email?['Email',m.submitted_by_email]:null,
    m.birth_date&&!m.hide_birth_date?['Born',formatDate(m.birth_date)]:null,
    !m.is_living?['Status','Deceased']:null,
    m.is_private?['Visibility','Hidden']:null,
    m.is_unlinked?['Connections','Unlinked']:null,
  ].filter(Boolean);

  const isBanned = m.submitted_by_uid && allBanned.some(b=>b.uid===m.submitted_by_uid);

  card.innerHTML=`
    <div class="card-header">
      ${avHTML}
      <div class="card-info">
        <div class="card-name">${escHtml(m.full_name)}${m.suffix?' '+escHtml(m.suffix):''}</div>
        <div class="card-sub"><span class="badge ${m.approved?'badge-approved':'badge-pending'}">${m.approved?'Approved':'Pending'}</span></div>
      </div>
    </div>
    <div class="card-body">
      ${details.map(([l,v])=>`<div class="card-detail"><strong>${l}:</strong> ${escHtml(v)}</div>`).join('')}
      ${m.notes?`<div class="card-notes">${escHtml(m.notes)}</div>`:''}
    </div>
    <div class="card-actions">
      ${!m.approved
        ?`<button class="btn btn-success" style="font-size:11px;padding:5px 12px;" onclick="approve('${m.id}')">Approve</button>`
        :`<button class="btn btn-warn" style="font-size:11px;padding:5px 12px;" onclick="unapprove('${m.id}')">Un-approve</button>`
      }
      <button class="btn btn-ghost" style="font-size:11px;padding:5px 12px;" onclick="openEditModal('${m.id}')">Edit</button>
      <button class="btn btn-danger" style="font-size:11px;padding:5px 12px;" onclick="deleteMember('${m.id}')">Delete</button>
      ${m.submitted_by_uid&&!isBanned?`<button class="btn btn-danger" style="font-size:11px;padding:5px 12px;" onclick="openBanModal('${m.submitted_by_uid}','${escHtml(m.submitted_by_name||m.submitted_by_email||'')}','${escHtml(m.submitted_by_email||'')}')">Ban User</button>`:''}
      ${isBanned?`<span class="badge badge-banned" style="margin-left:auto;">User Banned</span>`:''}
    </div>`;
  return card;
}

// ── Request card ──
function buildReqCard(r) {
  const m=allMembers.find(x=>x.id===r.member_id);
  const card=document.createElement('div');
  card.className='member-card req-card';
  card.innerHTML=`
    <div class="card-header">
      <div class="card-info">
        <div class="card-name">${r.request_type==='update'?'Update Request':'Removal Request'}</div>
        <div class="card-sub">For: <strong>${escHtml(m?.full_name||'Unknown member')}</strong></div>
      </div>
      <span class="badge badge-update">${cap(r.request_type)}</span>
    </div>
    <div class="card-body">
      <div class="card-detail"><strong>Requested by:</strong> ${escHtml(r.requester_name||r.requester_email||'Unknown')}</div>
      <div class="card-detail"><strong>Date:</strong> ${formatDate(r.created_at?.split('T')[0])}</div>
    </div>
    <div class="card-actions">
      <button class="btn btn-ghost" style="font-size:11px;padding:5px 12px;" onclick="openReqModal('${r.id}')">Review</button>
      ${r.requester_uid&&!allBanned.some(b=>b.uid===r.requester_uid)?`<button class="btn btn-danger" style="font-size:11px;padding:5px 12px;" onclick="openBanModal('${r.requester_uid}','${escHtml(r.requester_name||'')}','${escHtml(r.requester_email||'')}')">Ban User</button>`:''}
    </div>`;
  return card;
}

// ── Report card ──
function buildReportCard(r) {
  const m=allMembers.find(x=>x.id===r.member_id);
  const card=document.createElement('div');
  card.className='member-card report-card';
  card.innerHTML=`
    <div class="card-header">
      <div class="card-info">
        <div class="card-name">Report: ${escHtml(m?.full_name||'Unknown member')}</div>
        <div class="card-sub">by ${escHtml(r.reporter_email||'Anonymous')}</div>
      </div>
      <span class="badge badge-report">Report</span>
    </div>
    <div class="card-body">
      <div class="card-notes">${escHtml(r.reason)}</div>
      <div class="card-detail" style="margin-top:6px;"><strong>Submitted:</strong> ${formatDate(r.created_at?.split('T')[0])}</div>
    </div>
    <div class="card-actions">
      ${m?`<button class="btn btn-ghost" style="font-size:11px;padding:5px 12px;" onclick="openEditModal('${m.id}')">Edit Member</button>`:''}
      <button class="btn btn-success" style="font-size:11px;padding:5px 12px;" onclick="resolveReport('${r.id}')">Mark Resolved</button>
      ${r.reporter_uid&&!allBanned.some(b=>b.uid===r.reporter_uid)?`<button class="btn btn-danger" style="font-size:11px;padding:5px 12px;" onclick="openBanModal('${r.reporter_uid}','','${escHtml(r.reporter_email||'')}')">Ban Reporter</button>`:''}
    </div>`;
  return card;
}

// ── Banned card ──
function buildBannedCard(b) {
  const card=document.createElement('div');
  card.className='member-card banned-card';
  card.innerHTML=`
    <div class="card-header">
      <div class="card-info">
        <div class="card-name">${escHtml(b.name||b.email||'Unknown')}</div>
        <div class="card-sub">${escHtml(b.email||'')} · <span class="badge badge-banned">Banned</span></div>
      </div>
    </div>
    <div class="card-body">
      ${b.reason?`<div class="card-notes">${escHtml(b.reason)}</div>`:''}
      <div class="card-detail" style="margin-top:6px;"><strong>Banned:</strong> ${formatDate(b.banned_at?.split('T')[0])}</div>
    </div>
    <div class="card-actions">
      <button class="btn btn-success" style="font-size:11px;padding:5px 12px;" onclick="unbanUser('${b.id}')">Lift Ban</button>
    </div>`;
  return card;
}

// ── Approve / unapprove / delete ──
async function approve(id) {
  const { error } = await db.from('family_members').update({approved:true}).eq('id',id);
  if (error) { showToast('Error: '+error.message,'error'); return; }
  await db.from('relationships').update({approved:true}).or(`person_a_id.eq.${id},person_b_id.eq.${id}`).eq('approved',false);
  allMembers.find(m=>m.id===id).approved=true;
  updateCounts(); renderCards();
  showToast('Approved and now visible on tree','success');
}

async function unapprove(id) {
  const { error } = await db.from('family_members').update({approved:false}).eq('id',id);
  if (error) { showToast('Error','error'); return; }
  allMembers.find(m=>m.id===id).approved=false;
  updateCounts(); renderCards();
  showToast('Moved back to pending','success');
}

async function deleteMember(id) {
  const m=allMembers.find(x=>x.id===id);
  if (!confirm(`Permanently delete "${m?.full_name}"? This cannot be undone.`)) return;
  const { error } = await db.from('family_members').delete().eq('id',id);
  if (error) { showToast('Error deleting','error'); return; }
  allMembers=allMembers.filter(x=>x.id!==id);
  updateCounts(); renderCards();
  showToast('Member deleted','success');
}

// ── Add / Edit modal ──
function openAddModal() {
  document.getElementById('edit-id').value='';
  document.getElementById('member-modal-title').textContent='Add Member Directly';
  ['full_name','nickname','suffix','birth_place','bio','notes','photo_url','contact_email','facebook_url'].forEach(f=>{const el=document.getElementById('ef-'+f);if(el)el.value='';});
  document.getElementById('ef-generation_number').value='';
  document.getElementById('ef-birth_date').value='';
  document.getElementById('ef-death_date').value='';
  document.getElementById('ef-gender').value='';
  document.getElementById('ef-is_living').checked=true;
  document.getElementById('ef-approved').checked=true;
  ['hide_birth_date','hide_birth_place','hide_bio','hide_photo','is_private','is_unlinked'].forEach(f=>{document.getElementById('ef-'+f).checked=false;});
  document.getElementById('admin-conn-list').innerHTML='';
  Object.keys(adminPickerMap).forEach(k=>delete adminPickerMap[k]);
  document.getElementById('member-modal').classList.add('open');
}

function openEditModal(id) {
  const m=allMembers.find(x=>x.id===id);
  if (!m) return;
  document.getElementById('edit-id').value=id;
  document.getElementById('member-modal-title').textContent='Edit Member';
  ['full_name','nickname','suffix','birth_place','bio','notes','photo_url','contact_email','facebook_url'].forEach(f=>{const el=document.getElementById('ef-'+f);if(el)el.value=m[f]||'';});
  document.getElementById('ef-generation_number').value=m.generation_number||'';
  document.getElementById('ef-birth_date').value=m.birth_date||'';
  document.getElementById('ef-death_date').value=m.death_date||'';
  document.getElementById('ef-gender').value=m.gender||'';
  ['is_living','hide_birth_date','hide_birth_place','hide_bio','hide_photo','is_private','is_unlinked','approved'].forEach(f=>{document.getElementById('ef-'+f).checked=!!m[f];});
  document.getElementById('admin-conn-list').innerHTML='';
  Object.keys(adminPickerMap).forEach(k=>delete adminPickerMap[k]);
  document.getElementById('member-modal').classList.add('open');
}

function addAdminConn() {
  adminConnSeq++;
  const n = adminConnSeq;
  const rowId = 'ac-row-' + n;
  const div = document.createElement('div');
  div.className='conn-row'; div.id=rowId;

  const typeDiv=document.createElement('div'); typeDiv.className='field';
  typeDiv.innerHTML='<label>Type</label>';
  const sel=document.createElement('select'); sel.id='ac-type-'+n;
  REL_TYPES.forEach(([v,l])=>{const o=document.createElement('option');o.value=v;o.textContent=l;sel.appendChild(o);});
  typeDiv.appendChild(sel);

  const pickerDiv=document.createElement('div'); pickerDiv.className='field';
  pickerDiv.innerHTML='<label>Family member</label>';
  const pc=document.createElement('div'); pc.id='ac-pc-'+n;
  pickerDiv.appendChild(pc);

  const rmBtn=document.createElement('button'); rmBtn.type='button'; rmBtn.className='conn-remove';
  rmBtn.innerHTML='×'; rmBtn.onclick=()=>{document.getElementById(rowId)?.remove(); delete adminPickerMap[n];};

  div.appendChild(typeDiv); div.appendChild(pickerDiv); div.appendChild(rmBtn);
  document.getElementById('admin-conn-list').appendChild(div);

  const approvedOnly=allMembers.filter(m=>m.approved);
  const picker = new PersonPicker(pc, approvedOnly, null, 'Search members…');
  adminPickerMap[n] = { picker, selEl: sel };
}

async function saveMember() {
  const name=document.getElementById('ef-full_name').value.trim();
  if (!name) { showToast('Full name is required','error'); return; }
  const deathDate=document.getElementById('ef-death_date').value||null;
  const payload={
    full_name:name,
    nickname:document.getElementById('ef-nickname').value.trim()||null,
    suffix:document.getElementById('ef-suffix').value.trim()||null,
    gender:document.getElementById('ef-gender').value||null,
    birth_date:document.getElementById('ef-birth_date').value||null,
    death_date:deathDate,
    is_living:deathDate?false:document.getElementById('ef-is_living').checked,
    birth_place:document.getElementById('ef-birth_place').value.trim()||null,
    bio:document.getElementById('ef-bio').value.trim()||null,
    photo_url:document.getElementById('ef-photo_url').value.trim()||null,
    contact_email:document.getElementById('ef-contact_email').value.trim()||null,
    facebook_url:document.getElementById('ef-facebook_url').value.trim()||null,
    notes:document.getElementById('ef-notes').value.trim()||null,
    generation_number:parseInt(document.getElementById('ef-generation_number').value)||null,
    hide_birth_date:document.getElementById('ef-hide_birth_date').checked,
    hide_birth_place:document.getElementById('ef-hide_birth_place').checked,
    hide_bio:document.getElementById('ef-hide_bio').checked,
    hide_photo:document.getElementById('ef-hide_photo').checked,
    is_private:document.getElementById('ef-is_private').checked,
    is_unlinked:document.getElementById('ef-is_unlinked').checked,
    approved:document.getElementById('ef-approved').checked,
    updated_at:new Date().toISOString(),
  };

  const editId=document.getElementById('edit-id').value;
  let savedId=editId;

  if (editId) {
    const {error}=await db.from('family_members').update(payload).eq('id',editId);
    if (error) { showToast('Error: '+error.message,'error'); return; }
    const idx=allMembers.findIndex(x=>x.id===editId);
    if (idx>-1) allMembers[idx]={...allMembers[idx],...payload};
  } else {
    const {data,error}=await db.from('family_members').insert([payload]).select();
    if (error) { showToast('Error: '+error.message,'error'); return; }
    savedId=data?.[0]?.id;
    if (data?.[0]) allMembers.unshift(data[0]);
  }

  // Save connections using stored picker instances
  if (savedId) {
    for (const [n, { picker, selEl }] of Object.entries(adminPickerMap)) {
      const selected = picker.getValue();
      if (!selected) continue;
      const relType = selEl.value;
      const isChildType = ['child','niece_nephew','grandchild'].includes(relType);
      await db.from('relationships').insert([{
        person_a_id: isChildType ? savedId : selected.id,
        person_b_id: isChildType ? selected.id : savedId,
        relationship_type: relType === 'child' ? 'parent' : relType,
        approved: true, is_visible: true, is_biological: true,
      }]);
    }
    // Reload relationships
    const { data: rels } = await db.from('relationships').select('*');
    window._allRelationships = rels||[];
  }

  closeMemberModal(); updateCounts(); renderCards();
  showToast(editId?'Member updated':'Member added successfully','success');
}

function closeMemberModal() {
  document.getElementById('member-modal').classList.remove('open');
  Object.keys(adminPickerMap).forEach(k=>delete adminPickerMap[k]);
}

// ── Request review ──
let activeReqId = null;

function openReqModal(id) {
  const r=allRequests.find(x=>x.id===id);
  if (!r) return;
  activeReqId=id;
  const m=allMembers.find(x=>x.id===r.member_id);
  document.getElementById('req-modal-title').textContent = r.request_type==='update'?'Review Update Request':'Review Removal Request';

  let body=`<p style="font-size:13px;color:var(--text-light);margin-bottom:14px;">
    By <strong style="color:var(--text-mid)">${escHtml(r.requester_name||r.requester_email||'Unknown')}</strong>
    for <strong style="color:var(--text-mid)">${escHtml(m?.full_name||'Unknown member')}</strong>
  </p>`;

  if (r.request_type==='update'&&r.proposed_changes) {
    const changes=r.proposed_changes;
    const connChanges=changes._connections;
    const fieldChanges=Object.entries(changes).filter(([k])=>k!=='_connections');
    if (fieldChanges.length) {
      body+=`<table class="diff-table"><thead><tr><th>Field</th><th>Current</th><th>Proposed</th></tr></thead><tbody>
        ${fieldChanges.map(([k,v])=>`<tr><td style="font-weight:700;color:var(--text-mid);">${escHtml(k.replace(/_/g,' '))}</td><td class="diff-old">${escHtml(v.old||'—')}</td><td class="diff-new">${escHtml(v.new||'—')}</td></tr>`).join('')}
      </tbody></table>`;
    }
    if (connChanges?.new?.length) {
      body+=`<div style="margin-top:14px;font-size:13px;color:var(--text-mid);"><strong>New connections requested:</strong><ul style="margin-top:6px;padding-left:18px;">
        ${connChanges.new.map(c=>`<li>${escHtml(c.memberName)} (${escHtml(c.type)})</li>`).join('')}
      </ul></div>`;
    }
  } else if (r.request_type==='delete') {
    body+=`<div style="padding:11px 14px;background:var(--cream);border-radius:6px;font-size:14px;color:var(--text-mid);">
      <strong>Reason:</strong> ${escHtml(r.proposed_changes?.reason||'No reason provided')}
    </div>`;
  }

  document.getElementById('req-modal-body').innerHTML=body;
  const approveBtn=document.getElementById('req-approve-btn');
  approveBtn.textContent=r.request_type==='delete'?'Approve Removal':'Approve Changes';
  approveBtn.onclick=()=>handleReq(id,'approve');
  document.getElementById('req-reject-btn').onclick=()=>handleReq(id,'reject');
  document.getElementById('req-modal').classList.add('open');
}

async function handleReq(id, action) {
  const r=allRequests.find(x=>x.id===id);
  if (!r) return;
  if (action==='approve') {
    if (r.request_type==='update'&&r.proposed_changes) {
      const changes=r.proposed_changes;
      const fieldChanges={};
      Object.entries(changes).filter(([k])=>k!=='_connections').forEach(([k,v])=>{fieldChanges[k]=v.new;});
      if (Object.keys(fieldChanges).length) {
        await db.from('family_members').update({...fieldChanges,updated_at:new Date().toISOString()}).eq('id',r.member_id);
        const idx=allMembers.findIndex(x=>x.id===r.member_id);
        if (idx>-1) allMembers[idx]={...allMembers[idx],...fieldChanges};
      }
      // Save new connections
      if (changes._connections?.new?.length) {
        const rows=changes._connections.new.map(c=>({
          person_a_id:['child','niece_nephew','grandchild'].includes(c.type)?r.member_id:c.memberId,
          person_b_id:['child','niece_nephew','grandchild'].includes(c.type)?c.memberId:r.member_id,
          relationship_type:c.type==='child'?'parent':c.type,
          approved:true,is_visible:true,is_biological:true,
        }));
        await db.from('relationships').insert(rows);
        const {data:rels}=await db.from('relationships').select('*');
        window._allRelationships=rels||[];
      }
    } else if (r.request_type==='delete') {
      await db.from('family_members').delete().eq('id',r.member_id);
      allMembers=allMembers.filter(x=>x.id!==r.member_id);
    }
    showToast('Request approved','success');
  } else {
    showToast('Request rejected','info');
  }
  await db.from('member_requests').update({status:action==='approve'?'approved':'rejected',reviewed_at:new Date().toISOString()}).eq('id',id);
  allRequests.find(x=>x.id===id).status=action==='approve'?'approved':'rejected';
  closeReqModal(); updateCounts(); renderCards();
}

function closeReqModal() { document.getElementById('req-modal').classList.remove('open'); }

// ── Reports ──
async function resolveReport(id) {
  await db.from('reports').update({status:'resolved'}).eq('id',id);
  allReports.find(x=>x.id===id).status='resolved';
  updateCounts(); renderCards();
  showToast('Report marked as resolved','success');
}

// ── Ban ──
function openBanModal(uid, name, email) {
  pendingBanData = { uid, name, email };
  document.getElementById('ban-modal-sub').textContent = `You are about to ban: ${name||email||uid}. This will prevent them from submitting or editing anything.`;
  document.getElementById('ban-reason').value='';
  document.getElementById('ban-modal').classList.add('open');
}

async function confirmBan() {
  const reason=document.getElementById('ban-reason').value.trim();
  if (!reason) { showToast('Please provide a reason','error'); return; }
  const { uid, name, email } = pendingBanData;
  const { error } = await db.from('banned_users').insert([{ uid, name, email, reason }]);
  if (error) { showToast('Error banning user: '+error.message,'error'); return; }
  document.getElementById('ban-modal').classList.remove('open');
  await loadAll();
  showToast('User banned','success');
}

async function unbanUser(banId) {
  if (!confirm('Lift this ban? The user will be able to submit again.')) return;
  await db.from('banned_users').delete().eq('id',banId);
  allBanned=allBanned.filter(x=>x.id!==banId);
  updateCounts(); renderCards();
  showToast('Ban lifted','success');
}

// ── Init ──
async function init() {
  const { data: { session } } = await db.auth.getSession();
  if (session) showAdmin(session.user);
}
init();
