<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Family Tree</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Lato:wght@300;400;700&display=swap" rel="stylesheet"/>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/family-chart@0.1.2/family-chart.js"></script>
<style>
  :root {
    --cream: #faf7f2;
    --warm-white: #fff9f0;
    --brown-dark: #2c1810;
    --brown-mid: #6b3d2e;
    --brown-light: #c4956a;
    --brown-pale: #e8d5c0;
    --green-deep: #2d4a3e;
    --green-mid: #4a7c6f;
    --green-pale: #d4e6e1;
    --gold: #b8860b;
    --gold-light: #f0d080;
    --text-dark: #1a0f0a;
    --text-mid: #4a3728;
    --text-light: #8a6a55;
    --border: #d4c4b0;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Lato', sans-serif;
    background-color: var(--cream);
    color: var(--text-dark);
    min-height: 100vh;
  }

  /* ── Header ── */
  header {
    background: var(--brown-dark);
    padding: 20px 40px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 3px solid var(--gold);
  }

  .header-title {
    font-family: 'Playfair Display', serif;
    color: var(--gold-light);
    font-size: 26px;
    letter-spacing: 1px;
  }

  .header-subtitle {
    font-family: 'Lato', sans-serif;
    color: var(--brown-pale);
    font-size: 12px;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-top: 2px;
  }

  .header-actions {
    display: flex;
    gap: 12px;
    align-items: center;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 10px 20px;
    border-radius: 4px;
    font-family: 'Lato', sans-serif;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    cursor: pointer;
    text-decoration: none;
    border: none;
    transition: all 0.2s;
  }

  .btn-gold {
    background: var(--gold);
    color: var(--brown-dark);
  }
  .btn-gold:hover { background: var(--gold-light); }

  .btn-outline {
    background: transparent;
    color: var(--brown-pale);
    border: 1px solid var(--brown-light);
  }
  .btn-outline:hover { background: rgba(255,255,255,0.08); }

  /* ── Search & Filters ── */
  .toolbar {
    background: var(--warm-white);
    border-bottom: 1px solid var(--border);
    padding: 14px 40px;
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
  }

  .search-wrap {
    position: relative;
    flex: 1;
    min-width: 220px;
    max-width: 380px;
  }

  .search-wrap input {
    width: 100%;
    padding: 9px 16px 9px 40px;
    border: 1px solid var(--border);
    border-radius: 4px;
    font-family: 'Lato', sans-serif;
    font-size: 14px;
    background: white;
    color: var(--text-dark);
    outline: none;
    transition: border-color 0.2s;
  }
  .search-wrap input:focus { border-color: var(--brown-mid); }

  .search-icon {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-light);
    font-size: 15px;
  }

  .toolbar-label {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--text-light);
  }

  .generation-filter {
    display: flex;
    gap: 6px;
  }

  .gen-btn {
    padding: 6px 14px;
    border: 1px solid var(--border);
    border-radius: 20px;
    font-size: 12px;
    font-weight: 700;
    background: white;
    color: var(--text-mid);
    cursor: pointer;
    transition: all 0.2s;
  }
  .gen-btn.active, .gen-btn:hover {
    background: var(--brown-dark);
    color: var(--gold-light);
    border-color: var(--brown-dark);
  }

  .member-count {
    margin-left: auto;
    font-size: 13px;
    color: var(--text-light);
  }
  .member-count span { font-weight: 700; color: var(--text-mid); }

  /* ── Tree container ── */
  #tree-container {
    width: 100%;
    height: calc(100vh - 140px);
    overflow: hidden;
    position: relative;
    background: var(--cream);
    background-image:
      radial-gradient(circle at 1px 1px, var(--border) 1px, transparent 0);
    background-size: 28px 28px;
  }

  #tree-svg {
    width: 100%;
    height: 100%;
  }

  /* ── family-chart card overrides ── */
  .card {
    cursor: pointer;
    transition: filter 0.2s;
  }
  .card:hover { filter: brightness(1.05); }

  /* ── Empty / Loading states ── */
  .state-overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    pointer-events: none;
  }

  .state-overlay.hidden { display: none; }

  .spinner {
    width: 40px;
    height: 40px;
    border: 3px solid var(--brown-pale);
    border-top-color: var(--brown-mid);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .state-title {
    font-family: 'Playfair Display', serif;
    font-size: 22px;
    color: var(--text-mid);
  }
  .state-sub {
    font-size: 14px;
    color: var(--text-light);
    text-align: center;
    max-width: 320px;
    line-height: 1.6;
  }

  /* ── Member detail panel ── */
  .detail-panel {
    position: absolute;
    top: 20px;
    right: 20px;
    width: 300px;
    background: white;
    border: 1px solid var(--border);
    border-radius: 8px;
    box-shadow: 0 8px 32px rgba(44,24,16,0.12);
    overflow: hidden;
    transform: translateX(340px);
    transition: transform 0.3s ease;
    z-index: 100;
  }
  .detail-panel.open { transform: translateX(0); }

  .detail-photo {
    width: 100%;
    height: 180px;
    object-fit: cover;
    display: block;
    background: var(--brown-pale);
  }

  .detail-photo-placeholder {
    width: 100%;
    height: 180px;
    background: linear-gradient(135deg, var(--brown-pale), var(--green-pale));
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 56px;
    color: var(--brown-light);
  }

  .detail-body { padding: 20px; }

  .detail-name {
    font-family: 'Playfair Display', serif;
    font-size: 20px;
    color: var(--text-dark);
    line-height: 1.2;
  }

  .detail-nickname {
    font-size: 13px;
    color: var(--text-light);
    margin-top: 2px;
    font-style: italic;
  }

  .detail-meta {
    margin-top: 14px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .detail-row {
    display: flex;
    gap: 10px;
    font-size: 13px;
  }

  .detail-row-label {
    font-weight: 700;
    color: var(--text-light);
    text-transform: uppercase;
    font-size: 10px;
    letter-spacing: 1px;
    min-width: 70px;
    padding-top: 1px;
  }

  .detail-row-value { color: var(--text-mid); line-height: 1.5; }

  .detail-bio {
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px solid var(--border);
    font-size: 13px;
    color: var(--text-mid);
    line-height: 1.7;
  }

  .detail-close {
    position: absolute;
    top: 10px;
    right: 10px;
    width: 28px;
    height: 28px;
    background: rgba(0,0,0,0.4);
    color: white;
    border: none;
    border-radius: 50%;
    font-size: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
  }

  .unlinked-section {
    background: var(--warm-white);
    border-top: 1px solid var(--border);
    padding: 20px 40px;
  }
  .unlinked-title {
    font-family: 'Playfair Display', serif;
    font-size: 16px;
    color: var(--text-mid);
    margin-bottom: 12px;
  }
  .unlinked-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .unlinked-chip {
    padding: 6px 14px;
    background: white;
    border: 1px solid var(--border);
    border-radius: 20px;
    font-size: 13px;
    color: var(--text-mid);
    cursor: pointer;
    transition: all 0.2s;
  }
  .unlinked-chip:hover {
    background: var(--brown-dark);
    color: var(--gold-light);
    border-color: var(--brown-dark);
  }

  /* ── Zoom controls ── */
  .zoom-controls {
    position: absolute;
    bottom: 24px;
    left: 24px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    z-index: 50;
  }
  .zoom-btn {
    width: 36px;
    height: 36px;
    background: white;
    border: 1px solid var(--border);
    border-radius: 4px;
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-mid);
    transition: all 0.15s;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  }
  .zoom-btn:hover { background: var(--brown-dark); color: var(--gold-light); }

  @media (max-width: 600px) {
    header { padding: 14px 20px; }
    .header-title { font-size: 20px; }
    .toolbar { padding: 10px 20px; }
    .detail-panel { width: calc(100vw - 32px); right: 16px; }
  }
</style>
</head>
<body>

<header>
  <div>
    <div class="header-title" id="tree-title">Family Tree</div>
    <div class="header-subtitle">Our Heritage &amp; History</div>
  </div>
  <div class="header-actions">
    <a href="submit.html" class="btn btn-gold">+ Add Yourself</a>
    <a href="admin.html" class="btn btn-outline">Admin</a>
  </div>
</header>

<div class="toolbar">
  <div class="search-wrap">
    <span class="search-icon">⌕</span>
    <input type="text" id="search-input" placeholder="Search by name…" oninput="filterTree()"/>
  </div>
  <span class="toolbar-label">Generation</span>
  <div class="generation-filter" id="gen-filter"></div>
  <div class="member-count">
    <span id="member-count">0</span> members
  </div>
</div>

<div id="tree-container">
  <div class="state-overlay" id="loading-state">
    <div class="spinner"></div>
    <div class="state-title">Loading the family tree…</div>
  </div>
  <div class="state-overlay hidden" id="empty-state">
    <div class="state-title">No approved members yet</div>
    <div class="state-sub">Once the admin approves submissions, the family tree will appear here.</div>
    <a href="submit.html" class="btn btn-gold" style="pointer-events:all; margin-top:8px;">Be the first to add yourself</a>
  </div>
  <div id="tree-svg"></div>
  <div class="zoom-controls">
    <button class="zoom-btn" onclick="zoomIn()">+</button>
    <button class="zoom-btn" onclick="zoomReset()">⊡</button>
    <button class="zoom-btn" onclick="zoomOut()">−</button>
  </div>
</div>

<div id="unlinked-wrap" style="display:none">
  <div class="unlinked-section">
    <div class="unlinked-title">Members with unknown connections</div>
    <div class="unlinked-chips" id="unlinked-chips"></div>
  </div>
</div>

<!-- Detail panel -->
<div class="detail-panel" id="detail-panel">
  <button class="detail-close" onclick="closeDetail()">×</button>
  <div id="detail-photo-wrap"></div>
  <div class="detail-body">
    <div class="detail-name" id="d-name"></div>
    <div class="detail-nickname" id="d-nickname"></div>
    <div class="detail-meta" id="d-meta"></div>
    <div class="detail-bio" id="d-bio" style="display:none"></div>
  </div>
</div>

<script src="config.js"></script>
<script>
const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let allMembers = [], allRelationships = [], allMarriages = [];
let chart = null;
let currentZoom = 1;

async function loadTree() {
  try {
    const [mRes, rRes, marRes] = await Promise.all([
      db.from('family_members').select('*').eq('approved', true).eq('is_private', false),
      db.from('relationships').select('*').eq('approved', true).eq('is_visible', true),
      db.from('marriages').select('*').eq('approved', true).eq('is_visible', true)
    ]);

    allMembers = mRes.data || [];
    allRelationships = rRes.data || [];
    allMarriages = marRes.data || [];

    document.getElementById('loading-state').classList.add('hidden');
    document.getElementById('member-count').textContent = allMembers.length;

    if (allMembers.length === 0) {
      document.getElementById('empty-state').classList.remove('hidden');
      return;
    }

    buildGenerationFilter();
    renderTree(allMembers, allRelationships, allMarriages);
    renderUnlinked();
  } catch(e) {
    console.error(e);
    document.getElementById('loading-state').classList.add('hidden');
    document.getElementById('empty-state').classList.remove('hidden');
  }
}

function buildGenerationFilter() {
  const gens = [...new Set(allMembers.map(m => m.generation_number).filter(Boolean))].sort();
  const wrap = document.getElementById('gen-filter');
  wrap.innerHTML = '';
  const allBtn = document.createElement('button');
  allBtn.className = 'gen-btn active';
  allBtn.textContent = 'All';
  allBtn.onclick = () => { setActiveGen(allBtn); filterTree(); };
  wrap.appendChild(allBtn);
  gens.forEach(g => {
    const btn = document.createElement('button');
    btn.className = 'gen-btn';
    btn.textContent = 'Gen ' + g;
    btn.dataset.gen = g;
    btn.onclick = () => { setActiveGen(btn); filterTree(); };
    wrap.appendChild(btn);
  });
}

function setActiveGen(el) {
  document.querySelectorAll('.gen-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
}

function filterTree() {
  const query = document.getElementById('search-input').value.toLowerCase();
  const activeGen = document.querySelector('.gen-btn.active');
  const genFilter = activeGen?.dataset?.gen;

  let filtered = allMembers.filter(m => {
    const nameMatch = (m.full_name || '').toLowerCase().includes(query) ||
                      (m.nickname || '').toLowerCase().includes(query);
    const genMatch = !genFilter || String(m.generation_number) === genFilter;
    return nameMatch && genMatch;
  });

  const ids = new Set(filtered.map(m => m.id));
  const filteredRel = allRelationships.filter(r => ids.has(r.person_a_id) && ids.has(r.person_b_id));
  const filteredMar = allMarriages.filter(m => ids.has(m.person1_id) && ids.has(m.person2_id));
  renderTree(filtered, filteredRel, filteredMar);
  document.getElementById('member-count').textContent = filtered.length;
}

function renderTree(members, relationships, marriages) {
  const container = document.getElementById('tree-svg');
  container.innerHTML = '';

  const linked = members.filter(m => !m.is_unlinked);
  if (linked.length === 0) return;

  // Build family-chart data format
  const data = linked.map(m => {
    const parents = relationships
      .filter(r => r.person_b_id === m.id && r.relationship_type === 'parent')
      .map(r => r.person_a_id);

    const spouses = marriages
      .filter(mar => mar.person1_id === m.id || mar.person2_id === m.id)
      .map(mar => mar.person1_id === m.id ? mar.person2_id : mar.person1_id);

    return {
      id: m.id,
      data: {
        'first name': m.nickname || m.full_name.split(' ')[0],
        'last name': m.full_name.split(' ').slice(1).join(' '),
        'birthday': m.hide_birth_date ? '' : (m.birth_date || ''),
        'avatar': m.hide_photo ? '' : (m.photo_url || ''),
        'gender': m.gender || 'unknown',
        '_fullName': m.full_name,
        '_id': m.id,
        '_isLiving': m.is_living,
        '_suffix': m.suffix || ''
      },
      rels: {
        father: parents[0] || null,
        mother: parents[1] || null,
        spouses: spouses,
        children: relationships
          .filter(r => r.person_a_id === m.id && r.relationship_type === 'parent')
          .map(r => r.person_b_id)
      }
    };
  });

  try {
    const f3 = window.f3;
    if (!f3) { renderFallback(linked, container); return; }

    const cardDim = { w: 160, h: 80, text_x: 15, text_y: 15, img_w: 60, img_h: 60, img_x: 5, img_y: 10 };

    chart = f3.createChart('#tree-svg', data)
      .setCardXSpacing(40)
      .setCardYSpacing(60)
      .setCardDim(cardDim)
      .setOrientationVertical()
      .init();

    // Click handler
    document.querySelectorAll('.card').forEach(card => {
      card.addEventListener('click', function() {
        const id = this.dataset?.id;
        if (id) openDetail(id);
      });
    });
  } catch(e) {
    renderFallback(linked, container);
  }
}

function renderFallback(members, container) {
  // Simple SVG fallback if family-chart fails
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('width', '100%');
  svg.setAttribute('height', '100%');

  const cols = Math.ceil(Math.sqrt(members.length));
  members.forEach((m, i) => {
    const col = i % cols;
    const row = Math.floor(i / cols);
    const x = 60 + col * 200;
    const y = 60 + row * 120;

    const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    g.style.cursor = 'pointer';
    g.addEventListener('click', () => openDetail(m.id));

    const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
    rect.setAttribute('x', x); rect.setAttribute('y', y);
    rect.setAttribute('width', 160); rect.setAttribute('height', 70);
    rect.setAttribute('rx', 6);
    rect.setAttribute('fill', '#fff');
    rect.setAttribute('stroke', '#d4c4b0');
    rect.setAttribute('stroke-width', 1);

    const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    text.setAttribute('x', x + 80); text.setAttribute('y', y + 40);
    text.setAttribute('text-anchor', 'middle');
    text.setAttribute('font-family', 'Lato, sans-serif');
    text.setAttribute('font-size', '13');
    text.setAttribute('fill', '#2c1810');
    text.textContent = m.full_name + (m.suffix ? ' ' + m.suffix : '');

    g.appendChild(rect);
    g.appendChild(text);
    svg.appendChild(g);
  });

  container.appendChild(svg);
}

function renderUnlinked() {
  const unlinked = allMembers.filter(m => m.is_unlinked);
  const wrap = document.getElementById('unlinked-wrap');
  const chips = document.getElementById('unlinked-chips');
  if (unlinked.length === 0) { wrap.style.display = 'none'; return; }
  wrap.style.display = 'block';
  chips.innerHTML = '';
  unlinked.forEach(m => {
    const chip = document.createElement('div');
    chip.className = 'unlinked-chip';
    chip.textContent = m.full_name + (m.suffix ? ' ' + m.suffix : '');
    chip.onclick = () => openDetail(m.id);
    chips.appendChild(chip);
  });
}

function openDetail(id) {
  const m = allMembers.find(x => x.id === id);
  if (!m) return;

  const photoWrap = document.getElementById('detail-photo-wrap');
  if (m.photo_url && !m.hide_photo) {
    photoWrap.innerHTML = `<img class="detail-photo" src="${m.photo_url}" alt="${m.full_name}" onerror="this.style.display='none'"/>`;
  } else {
    const initials = m.full_name.split(' ').map(w => w[0]).join('').slice(0,2).toUpperCase();
    photoWrap.innerHTML = `<div class="detail-photo-placeholder">${initials}</div>`;
  }

  document.getElementById('d-name').textContent = m.full_name + (m.suffix ? ' ' + m.suffix : '');
  const nick = document.getElementById('d-nickname');
  nick.textContent = m.nickname ? `"${m.nickname}"` : '';
  nick.style.display = m.nickname ? 'block' : 'none';

  const meta = document.getElementById('d-meta');
  meta.innerHTML = '';

  const rows = [
    ['Born', m.hide_birth_date ? '—' : (m.birth_date ? formatDate(m.birth_date) : '—')],
    ['Birthplace', m.hide_birth_place ? '—' : (m.birth_place || '—')],
    ['Status', m.is_living ? 'Living' : (m.death_date ? 'Passed ' + formatDate(m.death_date) : 'Deceased')],
  ];
  rows.forEach(([label, val]) => {
    if (val === '—') return;
    meta.innerHTML += `<div class="detail-row">
      <div class="detail-row-label">${label}</div>
      <div class="detail-row-value">${val}</div>
    </div>`;
  });

  const bio = document.getElementById('d-bio');
  if (m.bio && !m.hide_bio) {
    bio.textContent = m.bio;
    bio.style.display = 'block';
  } else {
    bio.style.display = 'none';
  }

  document.getElementById('detail-panel').classList.add('open');
}

function closeDetail() {
  document.getElementById('detail-panel').classList.remove('open');
}

function formatDate(d) {
  if (!d) return '';
  const date = new Date(d);
  return date.toLocaleDateString('en-PH', { year: 'numeric', month: 'long', day: 'numeric' });
}

function zoomIn() { currentZoom = Math.min(2, currentZoom + 0.15); applyZoom(); }
function zoomOut() { currentZoom = Math.max(0.3, currentZoom - 0.15); applyZoom(); }
function zoomReset() { currentZoom = 1; applyZoom(); }
function applyZoom() {
  const svg = document.querySelector('#tree-svg svg');
  if (svg) svg.style.transform = `scale(${currentZoom})`;
}

loadTree();
</script>
</body>
</html>
