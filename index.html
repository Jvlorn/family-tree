<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Family Tree</title>
<link rel="stylesheet" href="shared.css"/>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/family-chart@0.1.2/family-chart.js"></script>
<script src="config.js"></script>
<script src="shared.js"></script>
<style>
  body { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

  .toolbar {
    background: var(--warm-white);
    border-bottom: 1px solid var(--border);
    padding: 12px 40px;
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
    flex-shrink: 0;
  }
  .search-wrap { position: relative; flex: 1; min-width: 200px; max-width: 340px; }
  .search-wrap input {
    width: 100%; padding: 8px 14px 8px 36px;
    border: 1px solid var(--border); border-radius: 4px;
    font-family: 'Lato', sans-serif; font-size: 14px;
    background: white; color: var(--text-dark); outline: none;
    transition: border-color 0.2s;
  }
  .search-wrap input:focus { border-color: var(--brown-mid); }
  .search-icon { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--text-light); font-size: 16px; pointer-events: none; }
  .toolbar-label { font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--text-light); }
  .gen-filters { display: flex; gap: 6px; flex-wrap: wrap; }
  .gen-btn {
    padding: 5px 13px; border: 1px solid var(--border); border-radius: 20px;
    font-size: 12px; font-weight: 700; background: white; color: var(--text-mid);
    cursor: pointer; transition: all 0.2s;
  }
  .gen-btn.active, .gen-btn:hover { background: var(--brown-dark); color: var(--gold-light); border-color: var(--brown-dark); }
  .member-count { margin-left: auto; font-size: 13px; color: var(--text-light); }
  .member-count span { font-weight: 700; color: var(--text-mid); }

  #tree-container {
    flex: 1; overflow: hidden; position: relative;
    background-color: var(--cream);
    background-image: radial-gradient(circle at 1px 1px, var(--border) 1px, transparent 0);
    background-size: 28px 28px;
  }
  #tree-svg { width: 100%; height: 100%; }

  .state-overlay {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px;
    pointer-events: none;
  }
  .state-overlay.hidden { display: none; }
  .state-title { font-family: 'Playfair Display', serif; font-size: 22px; color: var(--text-mid); }
  .state-sub { font-size: 14px; color: var(--text-light); text-align: center; max-width: 300px; line-height: 1.6; }

  /* Detail panel */
  .detail-panel {
    position: absolute; top: 20px; right: 20px; width: 300px;
    background: white; border: 1px solid var(--border); border-radius: 8px;
    box-shadow: var(--shadow); overflow: hidden;
    transform: translateX(340px); transition: transform 0.3s ease; z-index: 100;
  }
  .detail-panel.open { transform: translateX(0); }
  .detail-photo-wrap { position: relative; }
  .detail-photo { width: 100%; height: 170px; object-fit: cover; display: block; }
  .detail-photo-placeholder {
    width: 100%; height: 170px;
    background: linear-gradient(135deg, var(--brown-pale), var(--green-pale));
    display: flex; align-items: center; justify-content: center;
    font-family: 'Playfair Display', serif; font-size: 52px; color: var(--brown-light);
  }
  .detail-close {
    position: absolute; top: 8px; right: 8px;
    width: 28px; height: 28px; background: rgba(0,0,0,0.45); color: white;
    border: none; border-radius: 50%; font-size: 16px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .detail-body { padding: 18px; }
  .detail-name { font-family: 'Playfair Display', serif; font-size: 19px; color: var(--text-dark); line-height: 1.2; }
  .detail-nickname { font-size: 13px; color: var(--text-light); font-style: italic; margin-top: 2px; }
  .detail-badges { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .detail-meta { margin-top: 12px; display: flex; flex-direction: column; gap: 7px; }
  .detail-row { display: flex; gap: 8px; font-size: 13px; }
  .detail-row-label { font-weight: 700; color: var(--text-light); text-transform: uppercase; font-size: 10px; letter-spacing: 1px; min-width: 72px; padding-top: 1px; }
  .detail-row-value { color: var(--text-mid); line-height: 1.5; word-break: break-word; }
  .detail-bio { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border); font-size: 13px; color: var(--text-mid); line-height: 1.7; }
  .detail-social { margin-top: 12px; display: flex; gap: 10px; flex-wrap: wrap; }
  .detail-social a { font-size: 12px; color: var(--brown-mid); text-decoration: none; border: 1px solid var(--border); padding: 4px 10px; border-radius: 12px; transition: all 0.2s; }
  .detail-social a:hover { background: var(--brown-dark); color: var(--gold-light); border-color: var(--brown-dark); }
  .detail-actions { padding: 12px 18px; border-top: 1px solid var(--border); display: flex; gap: 8px; }

  /* Unlinked section */
  .unlinked-bar { background: var(--warm-white); border-top: 1px solid var(--border); padding: 16px 40px; flex-shrink: 0; }
  .unlinked-title { font-family: 'Playfair Display', serif; font-size: 14px; color: var(--text-mid); margin-bottom: 10px; }
  .unlinked-chips { display: flex; flex-wrap: wrap; gap: 7px; }
  .unlinked-chip {
    padding: 5px 14px; background: white; border: 1px solid var(--border);
    border-radius: 20px; font-size: 13px; color: var(--text-mid); cursor: pointer; transition: all 0.2s;
  }
  .unlinked-chip:hover { background: var(--brown-dark); color: var(--gold-light); border-color: var(--brown-dark); }

  /* Zoom */
  .zoom-controls { position: absolute; bottom: 20px; left: 20px; display: flex; flex-direction: column; gap: 4px; z-index: 50; }
  .zoom-btn {
    width: 34px; height: 34px; background: white; border: 1px solid var(--border);
    border-radius: 4px; font-size: 17px; cursor: pointer; display: flex;
    align-items: center; justify-content: center; color: var(--text-mid);
    box-shadow: 0 2px 8px rgba(0,0,0,0.07); transition: all 0.15s;
  }
  .zoom-btn:hover { background: var(--brown-dark); color: var(--gold-light); }

  /* Request edit modal */
  .modal-backdrop {
    display: none; position: fixed; inset: 0;
    background: rgba(44,24,16,0.5); z-index: 500;
    align-items: center; justify-content: center; padding: 20px;
  }
  .modal-backdrop.open { display: flex; }
  .modal {
    background: white; border-radius: 10px; width: 100%;
    max-width: 560px; max-height: 88vh; overflow-y: auto;
    padding: 32px; position: relative;
  }
  .modal-title { font-family: 'Playfair Display', serif; font-size: 22px; color: var(--brown-dark); margin-bottom: 6px; }
  .modal-sub { font-size: 13px; color: var(--text-light); margin-bottom: 24px; line-height: 1.5; }
  .modal-close { position: absolute; top: 14px; right: 14px; width: 28px; height: 28px; background: var(--cream); border: 1px solid var(--border); border-radius: 50%; font-size: 15px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .diff-row { display: grid; grid-template-columns: 120px 1fr 1fr; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--cream); font-size: 13px; align-items: start; }
  .diff-label { font-weight: 700; color: var(--text-light); font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; padding-top: 2px; }
  .diff-old { color: var(--text-light); text-decoration: line-through; }
  .diff-new { color: var(--green-deep); font-weight: 700; }
  .modal-footer { margin-top: 20px; display: flex; gap: 10px; justify-content: flex-end; }

  @media (max-width: 600px) {
    .toolbar { padding: 10px 16px; }
    .detail-panel { width: calc(100vw - 32px); right: 16px; }
    .unlinked-bar { padding: 14px 16px; }
  }
</style>
</head>
<body>

<header class="site-header">
  <div class="logo">
    <div class="logo-title" id="site-title"></div>
    <div class="logo-sub" id="site-tagline"></div>
  </div>
  <div class="header-actions">
    <a id="add-btn" href="submit.html" class="btn btn-gold">+ Add Yourself</a>
    <a href="admin.html" class="btn btn-outline">Admin</a>
  </div>
</header>

<div class="toolbar">
  <div class="search-wrap">
    <span class="search-icon">⌕</span>
    <input type="text" id="search-input" placeholder="Search by name…" oninput="filterTree()"/>
  </div>
  <span class="toolbar-label">Generation</span>
  <div class="gen-filters" id="gen-filters"></div>
  <div class="member-count"><span id="member-count">0</span> members</div>
</div>

<div id="tree-container">
  <div class="state-overlay" id="loading-state">
    <div class="spinner"></div>
    <div class="state-title">Loading the family tree…</div>
  </div>
  <div class="state-overlay hidden" id="empty-state">
    <div class="state-title">No members yet</div>
    <div class="state-sub">Once the admin approves submissions, the family tree will appear here.</div>
  </div>
  <div id="tree-svg"></div>
  <div class="zoom-controls">
    <button class="zoom-btn" onclick="zoomIn()">+</button>
    <button class="zoom-btn" onclick="zoomReset()">⊡</button>
    <button class="zoom-btn" onclick="zoomOut()">−</button>
  </div>
</div>

<div id="unlinked-wrap" style="display:none">
  <div class="unlinked-bar">
    <div class="unlinked-title">Members with unknown connections</div>
    <div class="unlinked-chips" id="unlinked-chips"></div>
  </div>
</div>

<footer class="site-footer" id="site-footer"></footer>

<!-- Detail panel -->
<div class="detail-panel" id="detail-panel">
  <div class="detail-photo-wrap">
    <div id="detail-photo-slot"></div>
    <button class="detail-close" onclick="closeDetail()">×</button>
  </div>
  <div class="detail-body">
    <div class="detail-name" id="d-name"></div>
    <div class="detail-nickname" id="d-nickname"></div>
    <div class="detail-badges" id="d-badges"></div>
    <div class="detail-meta" id="d-meta"></div>
    <div class="detail-bio" id="d-bio" style="display:none"></div>
    <div class="detail-social" id="d-social"></div>
  </div>
  <div class="detail-actions" id="d-actions"></div>
</div>

<!-- Edit request modal -->
<div class="modal-backdrop" id="edit-modal">
  <div class="modal">
    <button class="modal-close" onclick="closeEditModal()">×</button>
    <div class="modal-title">Request an Edit</div>
    <div class="modal-sub" id="edit-modal-sub"></div>
    <div id="edit-form-fields" class="form-grid"></div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeEditModal()">Cancel</button>
      <button class="btn btn-dark" onclick="submitEditRequest()">Submit Request</button>
    </div>
  </div>
</div>

<!-- Delete request modal -->
<div class="modal-backdrop" id="delete-modal">
  <div class="modal">
    <button class="modal-close" onclick="closeDeleteModal()">×</button>
    <div class="modal-title">Request Removal</div>
    <div class="modal-sub" id="delete-modal-sub"></div>
    <div class="field">
      <label>Reason for removal <span class="req">*</span></label>
      <textarea id="delete-reason" placeholder="Please explain why this person should be removed from the family tree…"></textarea>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeDeleteModal()">Cancel</button>
      <button class="btn btn-danger" onclick="submitDeleteRequest()">Submit Removal Request</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
let allMembers = [], allRelationships = [], allMarriages = [];
let currentZoom = 1;
let currentUser = null;
let activeDetailId = null;

// Set site labels
document.getElementById('site-title').textContent = SITE_CONFIG.familyName;
document.getElementById('site-tagline').textContent = SITE_CONFIG.tagline;

// Add invite token to submit link
const token = new URLSearchParams(location.search).get('token') || '';
document.getElementById('add-btn').href = 'submit.html' + (token ? '?token=' + token : '');

async function init() {
  renderFooter();
  const { data: { session } } = await db.auth.getSession();
  currentUser = session?.user || null;
  await loadTree();
}

async function loadTree() {
  try {
    const [mRes, rRes, marRes] = await Promise.all([
      db.from('family_members').select('*').eq('approved', true).eq('is_private', false),
      db.from('relationships').select('*').eq('approved', true).eq('is_visible', true),
      db.from('marriages').select('*').eq('approved', true).eq('is_visible', true)
    ]);
    allMembers = mRes.data || [];
    allRelationships = rRes.data || [];
    allMarriages = marRes.data || [];
    window._relationships = allRelationships;

    document.getElementById('loading-state').classList.add('hidden');
    document.getElementById('member-count').textContent = allMembers.length;

    if (allMembers.length === 0) {
      document.getElementById('empty-state').classList.remove('hidden');
      return;
    }
    buildGenFilter();
    renderTree(allMembers, allRelationships, allMarriages);
    renderUnlinked();
  } catch(e) {
    console.error(e);
    document.getElementById('loading-state').classList.add('hidden');
    document.getElementById('empty-state').classList.remove('hidden');
  }
}

function buildGenFilter() {
  const gens = [...new Set(allMembers.map(m => m.generation_number).filter(Boolean))].sort((a,b)=>a-b);
  const wrap = document.getElementById('gen-filters');
  wrap.innerHTML = '';
  const all = document.createElement('button');
  all.className = 'gen-btn active'; all.textContent = 'All';
  all.onclick = () => { setActiveGen(all); filterTree(); };
  wrap.appendChild(all);
  gens.forEach(g => {
    const b = document.createElement('button');
    b.className = 'gen-btn'; b.textContent = 'Gen ' + g; b.dataset.gen = g;
    b.onclick = () => { setActiveGen(b); filterTree(); };
    wrap.appendChild(b);
  });
}

function setActiveGen(el) {
  document.querySelectorAll('.gen-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
}

function filterTree() {
  const q = document.getElementById('search-input').value.toLowerCase();
  const activeGen = document.querySelector('.gen-btn.active');
  const genFilter = activeGen?.dataset?.gen;
  let filtered = allMembers.filter(m => {
    const nm = (m.full_name + ' ' + (m.nickname||'')).toLowerCase().includes(q);
    const gn = !genFilter || String(m.generation_number) === genFilter;
    return nm && gn;
  });
  const ids = new Set(filtered.map(m => m.id));
  renderTree(filtered,
    allRelationships.filter(r => ids.has(r.person_a_id) && ids.has(r.person_b_id)),
    allMarriages.filter(m => ids.has(m.person1_id) && ids.has(m.person2_id))
  );
  document.getElementById('member-count').textContent = filtered.length;
}

function renderTree(members, relationships, marriages) {
  const container = document.getElementById('tree-svg');
  container.innerHTML = '';
  const linked = members.filter(m => !m.is_unlinked);
  if (!linked.length) return;

  const data = linked.map(m => {
    const parents = relationships
      .filter(r => r.person_b_id === m.id && r.relationship_type === 'parent')
      .map(r => r.person_a_id);
    const spouses = marriages
      .filter(mar => mar.person1_id === m.id || mar.person2_id === m.id)
      .map(mar => mar.person1_id === m.id ? mar.person2_id : mar.person1_id);
    const children = relationships
      .filter(r => r.person_a_id === m.id && r.relationship_type === 'parent')
      .map(r => r.person_b_id);
    return {
      id: m.id,
      data: {
        'first name': m.nickname || m.full_name.split(' ')[0],
        'last name': m.full_name.split(' ').slice(1).join(' '),
        'birthday': m.hide_birth_date ? '' : (m.birth_date || ''),
        'avatar': (m.hide_photo ? '' : (m.photo_url || '')),
        'gender': m.gender || 'unknown',
      },
      rels: { father: parents[0]||null, mother: parents[1]||null, spouses, children }
    };
  });

  try {
    if (window.f3) {
      window.f3.createChart('#tree-svg', data)
        .setCardXSpacing(40).setCardYSpacing(60)
        .setOrientationVertical().init();
      document.querySelectorAll('.card').forEach(card => {
        card.style.cursor = 'pointer';
        card.addEventListener('click', function() {
          const id = this.getAttribute('data-id') || this.id;
          if (id) openDetail(id);
        });
      });
    } else {
      renderFallback(linked, container);
    }
  } catch(e) { renderFallback(linked, container); }
}

function renderFallback(members, container) {
  const svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.setAttribute('width','100%'); svg.setAttribute('height','100%');
  const cols = Math.max(1, Math.ceil(Math.sqrt(members.length)));
  members.forEach((m,i) => {
    const x = 40 + (i % cols) * 200, y = 40 + Math.floor(i / cols) * 110;
    const g = document.createElementNS('http://www.w3.org/2000/svg','g');
    g.style.cursor = 'pointer';
    g.addEventListener('click', () => openDetail(m.id));
    const rect = document.createElementNS('http://www.w3.org/2000/svg','rect');
    Object.entries({x,y,width:170,height:70,rx:6,fill:'#fff',stroke:'#d4c4b0','stroke-width':1}).forEach(([k,v])=>rect.setAttribute(k,v));
    const text = document.createElementNS('http://www.w3.org/2000/svg','text');
    Object.entries({x:x+85,y:y+35,'text-anchor':'middle','font-family':'Lato,sans-serif','font-size':'13',fill:'#2c1810'}).forEach(([k,v])=>text.setAttribute(k,v));
    text.textContent = m.full_name + (m.suffix?' '+m.suffix:'');
    g.appendChild(rect); g.appendChild(text); svg.appendChild(g);
  });
  container.appendChild(svg);
}

function renderUnlinked() {
  const unlinked = allMembers.filter(m => m.is_unlinked);
  const wrap = document.getElementById('unlinked-wrap');
  if (!unlinked.length) { wrap.style.display='none'; return; }
  wrap.style.display = 'block';
  const chips = document.getElementById('unlinked-chips');
  chips.innerHTML = '';
  unlinked.forEach(m => {
    const c = document.createElement('div');
    c.className = 'unlinked-chip';
    c.textContent = m.full_name + (m.suffix?' '+m.suffix:'');
    c.onclick = () => openDetail(m.id);
    chips.appendChild(c);
  });
}

function openDetail(id) {
  const m = allMembers.find(x => x.id === id);
  if (!m) return;
  activeDetailId = id;

  // Photo
  const slot = document.getElementById('detail-photo-slot');
  if (m.photo_url && !m.hide_photo) {
    slot.innerHTML = `<img class="detail-photo" src="${m.photo_url}" alt="${escHtml(m.full_name)}" onerror="this.style.display='none'"/>`;
  } else {
    slot.innerHTML = `<div class="detail-photo-placeholder">${initials(m.full_name)}</div>`;
  }

  document.getElementById('d-name').textContent = m.full_name + (m.suffix?' '+m.suffix:'');
  const nick = document.getElementById('d-nickname');
  nick.textContent = m.nickname ? `"${m.nickname}"` : '';
  nick.style.display = m.nickname ? 'block' : 'none';

  // Badges
  const badges = document.getElementById('d-badges');
  badges.innerHTML = '';
  if (!m.is_living) badges.innerHTML += `<span class="badge badge-deceased">Deceased</span>`;
  if (m.is_unlinked) badges.innerHTML += `<span class="badge badge-pending">Unlinked</span>`;

  // Meta rows
  const meta = document.getElementById('d-meta');
  meta.innerHTML = '';
  const rows = [
    ['Born', !m.hide_birth_date && m.birth_date ? formatDate(m.birth_date) : null],
    ['Birthplace', !m.hide_birth_place && m.birth_place ? m.birth_place : null],
    ['Passed', !m.is_living && m.death_date ? formatDate(m.death_date) : null],
  ];
  rows.forEach(([l,v]) => {
    if (!v) return;
    meta.innerHTML += `<div class="detail-row"><div class="detail-row-label">${l}</div><div class="detail-row-value">${escHtml(v)}</div></div>`;
  });

  // Find parents via relationships
  const parentIds = allRelationships.filter(r => r.person_b_id === m.id && r.relationship_type === 'parent').map(r => r.person_a_id);
  const parentNames = parentIds.map(pid => allMembers.find(x=>x.id===pid)?.full_name).filter(Boolean);
  if (parentNames.length) {
    meta.innerHTML += `<div class="detail-row"><div class="detail-row-label">Parents</div><div class="detail-row-value">${escHtml(parentNames.join(' & '))}</div></div>`;
  }

  // Spouse
  const spouseMar = allMarriages.filter(mar => mar.person1_id===m.id || mar.person2_id===m.id);
  spouseMar.forEach(mar => {
    const sid = mar.person1_id===m.id ? mar.person2_id : mar.person1_id;
    const sp = allMembers.find(x=>x.id===sid);
    if (!sp) return;
    const label = mar.status === 'married' ? 'Spouse' : cap(mar.status);
    meta.innerHTML += `<div class="detail-row"><div class="detail-row-label">${label}</div><div class="detail-row-value">${escHtml(sp.full_name)}</div></div>`;
  });

  // Bio
  const bio = document.getElementById('d-bio');
  if (m.bio && !m.hide_bio) { bio.textContent = m.bio; bio.style.display='block'; }
  else bio.style.display='none';

  // Social links
  const social = document.getElementById('d-social');
  social.innerHTML = '';
  if (m.contact_email) social.innerHTML += `<a href="mailto:${escHtml(m.contact_email)}">✉ Email</a>`;
  if (m.facebook_url) social.innerHTML += `<a href="${escHtml(m.facebook_url)}" target="_blank" rel="noopener">f Facebook</a>`;

  // Actions — show edit/delete only if user owns this record or submitted it
  const actions = document.getElementById('d-actions');
  actions.innerHTML = '';
  if (currentUser) {
    const isOwn = m.submitted_by_uid === currentUser.id;
    const isDeceased = !m.is_living;
    const submittedDeceased = isDeceased && m.submitted_by_uid === currentUser.id;
    if (isOwn || submittedDeceased) {
      actions.innerHTML = `
        <button class="btn btn-ghost" style="font-size:12px;padding:7px 14px;" onclick="openEditModal('${m.id}')">Request Edit</button>
        <button class="btn btn-danger" style="font-size:12px;padding:7px 14px;" onclick="openDeleteModal('${m.id}')">Request Removal</button>
      `;
    }
  }

  document.getElementById('detail-panel').classList.add('open');
}

function closeDetail() {
  document.getElementById('detail-panel').classList.remove('open');
  activeDetailId = null;
}

// ── Edit request modal ──
const EDITABLE_FIELDS = [
  { key:'full_name', label:'Full name', type:'text' },
  { key:'nickname', label:'Nickname', type:'text' },
  { key:'suffix', label:'Suffix', type:'text' },
  { key:'birth_date', label:'Birth date', type:'date' },
  { key:'death_date', label:'Death date', type:'date' },
  { key:'birth_place', label:'Birthplace', type:'text' },
  { key:'bio', label:'Bio', type:'textarea' },
  { key:'photo_url', label:'Photo URL', type:'text' },
  { key:'contact_email', label:'Contact email', type:'text' },
  { key:'facebook_url', label:'Facebook URL', type:'text' },
];

function openEditModal(id) {
  const m = allMembers.find(x=>x.id===id);
  if (!m) return;
  document.getElementById('edit-modal-sub').textContent = `Editing: ${m.full_name}${m.suffix?' '+m.suffix:''}. Changes will be reviewed by the admin before going live.`;
  const fields = document.getElementById('edit-form-fields');
  fields.innerHTML = '';
  EDITABLE_FIELDS.forEach(f => {
    const div = document.createElement('div');
    div.className = 'field' + (f.type==='textarea'?' span-2':'');
    div.innerHTML = `<label>${f.label}</label>`;
    let el;
    if (f.type==='textarea') { el=document.createElement('textarea'); el.rows=3; }
    else { el=document.createElement('input'); el.type=f.type; }
    el.id = 'edit-field-'+f.key;
    el.value = m[f.key]||'';
    div.appendChild(el);
    fields.appendChild(div);
  });
  document.getElementById('edit-modal').classList.add('open');
}

async function submitEditRequest() {
  if (!currentUser) { showToast('Please sign in first', 'error'); return; }
  const m = allMembers.find(x=>x.id===activeDetailId);
  if (!m) return;
  const changes = {};
  EDITABLE_FIELDS.forEach(f => {
    const newVal = document.getElementById('edit-field-'+f.key)?.value?.trim()||null;
    const oldVal = m[f.key]||null;
    if (newVal !== oldVal) changes[f.key] = { old: oldVal, new: newVal };
  });
  if (!Object.keys(changes).length) { showToast('No changes detected', 'info'); return; }
  const { error } = await db.from('member_requests').insert([{
    request_type: 'update',
    member_id: m.id,
    requester_uid: currentUser.id,
    requester_name: currentUser.user_metadata?.full_name || currentUser.email,
    requester_email: currentUser.email,
    proposed_changes: changes,
  }]);
  if (error) { showToast('Error submitting request', 'error'); return; }
  closeEditModal();
  showToast('Edit request submitted! The admin will review it soon.', 'success');
}

function closeEditModal() { document.getElementById('edit-modal').classList.remove('open'); }

// ── Delete request modal ──
function openDeleteModal(id) {
  const m = allMembers.find(x=>x.id===id);
  if (!m) return;
  document.getElementById('delete-modal-sub').textContent = `You are requesting removal of: ${m.full_name}${m.suffix?' '+m.suffix:''}. Please provide a reason.`;
  document.getElementById('delete-reason').value = '';
  document.getElementById('delete-modal').classList.add('open');
}

async function submitDeleteRequest() {
  if (!currentUser) { showToast('Please sign in first','error'); return; }
  const reason = document.getElementById('delete-reason').value.trim();
  if (!reason) { showToast('Please provide a reason','error'); return; }
  const m = allMembers.find(x=>x.id===activeDetailId);
  if (!m) return;
  const { error } = await db.from('member_requests').insert([{
    request_type: 'delete',
    member_id: m.id,
    requester_uid: currentUser.id,
    requester_name: currentUser.user_metadata?.full_name || currentUser.email,
    requester_email: currentUser.email,
    proposed_changes: { reason },
  }]);
  if (error) { showToast('Error submitting request','error'); return; }
  closeDeleteModal();
  showToast('Removal request submitted. The admin will review it.','success');
}

function closeDeleteModal() { document.getElementById('delete-modal').classList.remove('open'); }

function zoomIn() { currentZoom = Math.min(2.5, currentZoom+0.15); applyZoom(); }
function zoomOut() { currentZoom = Math.max(0.3, currentZoom-0.15); applyZoom(); }
function zoomReset() { currentZoom=1; applyZoom(); }
function applyZoom() {
  const svg = document.querySelector('#tree-svg svg');
  if (svg) { svg.style.transformOrigin='center top'; svg.style.transform=`scale(${currentZoom})`; }
}

init();
</script>
</body>
</html>
